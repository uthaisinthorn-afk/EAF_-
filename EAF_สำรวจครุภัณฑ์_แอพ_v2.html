<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สำรวจครุภัณฑ์ EAF</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#18212f;--mut:#667085;--line:#e1e6ee;--pri:#1f5fbf;--ok:#1e8e4a;--okbg:#e4f5ea;--warn:#a15c00;--warnbg:#fff1d6;--bad:#c4281c;--badbg:#fde7e5}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Thai","Sarabun",sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.g{background:#e8ecf3;color:var(--tx)}button.ok{background:var(--ok)}button.bad{background:var(--bad)}button.w{background:#b36b00}
button:disabled{opacity:.45}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);width:100%}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;z-index:5}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 90px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}.bar>div{height:100%;background:var(--ok);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.m{display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.m b{font-size:16px}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;background:var(--line)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding:14px 14px 40px}
.sheet .in{max-width:720px;margin:0 auto}
.alert{border-radius:12px;padding:14px;margin:10px 0;font-weight:600}
.alert.bad{background:var(--badbg);color:var(--bad);border:2px solid var(--bad)}
.alert.warn{background:var(--warnbg);color:var(--warn);border:2px solid #e0a030}
.alert.ok{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
.modal{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--card);border-radius:16px;padding:18px;max-width:440px;width:100%}
.big{font-size:22px;margin:0 0 6px}
video{width:100%;max-height:60vh;background:#000;border-radius:12px}
.hide{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.5px;word-break:break-all}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--card:#1a212c;--tx:#e8edf5;--mut:#93a0b4;--line:#2b3442;--pri:#4b8ef0;--ok:#3ec16f;--okbg:#17321f;--warn:#f0b04a;--warnbg:#3a2d12;--bad:#ff6a5e;--badbg:#3d1916}button.g{background:#2b3442}}
</style>
</head>
<body>
<header>
 <div class="row" style="justify-content:space-between">
  <b>สำรวจเลขครุภัณฑ์ EAF</b>
  <span id="pct" class="mut"></span>
 </div>
 <div class="bar"><div id="fill"></div></div>
 <div id="cnt" class="mut" style="margin-top:4px"></div>
 <div id="sync" class="mut" style="margin-top:2px"></div>
</header>

<div class="wrap">
 <div class="card" id="whoCard">
  <div class="mut">ชื่อผู้สำรวจ (บันทึกพร้อมทุกรายการ)</div>
  <input id="who" placeholder="เช่น ช่างสมชาย" autocomplete="name">
 </div>
 <div class="grid2" style="margin-bottom:8px">
  <button id="lookup">📷 สแกนเช็คว่าซ้ำไหม</button>
  <button class="g" id="menuBtn">⋯ เมนู / ส่งออก</button>
 </div>
 <div class="card">
  <div class="grid2">
   <select id="fFloor"></select>
   <select id="fZone"></select>
   <select id="fStat">
    <option value="todo">ยังไม่สำรวจ</option><option value="done">สำรวจแล้ว</option><option value="all">ทั้งหมด</option>
   </select>
   <select id="fEv"></select>
  </div>
  <input id="q" placeholder="ค้นหารหัสเครื่อง / ห้อง" style="margin-top:8px">
  <div class="mut" id="listInfo" style="margin-top:6px"></div>
 </div>
 <div id="list"></div>
 <button class="g" id="more" style="width:100%">แสดงเพิ่ม</button>
</div>

<!-- detail -->
<div class="sheet hide" id="detail"><div class="in" id="detailIn"></div></div>
<!-- scan -->
<div class="sheet hide" id="scan" style="z-index:30"><div class="in">
 <h2 class="big" id="scanTitle">สแกนบาร์โค้ด</h2>
 <div class="mut" id="scanSub"></div>
 <video id="vid" playsinline muted style="margin-top:8px"></video>
 <div class="mut" id="scanMsg" style="margin:8px 0"></div>
 <div class="row"><button class="g" id="scanClose">ปิดกล้อง</button></div>
</div></div>
<!-- menu -->
<div class="sheet hide" id="menu"><div class="in">
 <h2 class="big">เมนู</h2>
 <div class="card"><b>ซิงค์ Google Sheets (ทุกเครื่องเห็นผลร่วมกัน)</b>
  <input id="cfgUrl" placeholder="URL ของ Apps Script (https://script.google.com/...)" style="margin-top:8px">
  <input id="cfgKey" placeholder="รหัสทีม" style="margin-top:8px">
  <div class="row" style="margin-top:8px"><button id="cfgSave">บันทึก/ทดสอบการเชื่อมต่อ</button><button class="g" id="syncNow">ซิงค์เดี๋ยวนี้</button></div>
  <div id="cfgRes" class="mut" style="margin-top:6px"></div></div>
 <div class="card"><b>ส่งออกผลสำรวจ</b>
  <div class="grid2" style="margin-top:8px"><button id="expCsv">ไฟล์ CSV (เปิดใน Excel)</button><button id="expJson">ไฟล์สำรอง JSON</button></div>
  <div class="mut" style="margin-top:6px">ส่งไฟล์ JSON ให้หัวหน้ารวมผลของหลายเครื่องได้</div></div>
 <div class="card"><b>รวมผลจากเครื่องอื่น (นำเข้า JSON)</b>
  <input type="file" id="imp" accept=".json" style="margin-top:8px"><div id="impRes" class="mut" style="margin-top:6px"></div></div>
 <div class="card"><b>ความคืบหน้ารายชั้น</b><div id="byFloor" class="mut" style="margin-top:6px"></div></div>
 <div class="card"><b>ล้างข้อมูลในเครื่องนี้</b>
  <div class="mut">ควรส่งออกสำรองก่อน</div>
  <button class="bad" id="wipe" style="margin-top:8px">ล้างผลสำรวจทั้งหมด</button></div>
 <button class="g" id="menuClose" style="width:100%">กลับ</button>
</div></div>
<div id="modal" class="modal hide"><div id="modalIn"></div></div>

<script>

const DATA=JSON.parse(document.getElementById('DATA').textContent);
const MACH=DATA.m.map(a=>({id:a[0],fl:a[1],zn:a[2],room:a[3],model:a[4],ev:a[5],nsrc:a[6],status:a[7],remark:a[8],efn:a[9],efno:a[10]}));

const BYID=Object.fromEntries(MACH.map(m=>[m.id,m]));
const RESULTS={found:'พบป้าย/มีเลข',nolabel:'ไม่มีป้ายจริง',nomach:'ไม่พบเครื่อง/ไม่มีพัดลม',unread:'ป้ายอ่านไม่ได้'};
let S={who:'',recs:{},q:[],cfg:{url:'',key:''}}; // recs[machineId]={res,asset,by,at,note,dupReg}
const digits=s=>String(s||'').replace(/\D/g,'');
function assetOwner(d){ // surveyed machine that already holds this asset number
  for(const [id,r] of Object.entries(S.recs)) if(r.asset&&digits(r.asset)===d) return id;
  return null;
}
// check = what the app says when a code is scanned/typed
function checkCode(raw,forId){
  const d=digits(raw);
  if(d.length<8) return {k:'invalid',d};
  const own=assetOwner(d);
  if(own) return {k:'dup',d,id:own,rec:S.recs[own],same:own===forId};
  if(KNOWN[d]) return {k:'registry',d,reg:KNOWN[d]};
  return {k:'new',d,lenWarn:d.length!==19};
}
function saveFound(id,raw,by,at){
  const c=checkCode(raw,id);
  if(c.k==='invalid'||c.k==='dup') return c;
  S.recs[id]={res:'found',asset:c.d,by,at,note:(S.recs[id]||{}).note||'',dupReg:c.k==='registry'?c.reg[0]:''};
  return c;
}
function saveOther(id,res,by,at){S.recs[id]={res,asset:'',by,at,note:(S.recs[id]||{}).note||'',dupReg:''};}
function mergeIn(inc){ // returns report
  const rep={added:0,same:0,newer:0,kept:0,assetClash:[]};
  for(const [id,r] of Object.entries(inc)){
    if(!BYID[id]) continue;
    const cur=S.recs[id];
    if(!cur){
      const own=r.asset?assetOwner(digits(r.asset)):null;
      if(own&&own!==id) rep.assetClash.push([id,own,r.asset]);
      S.recs[id]=r;rep.added++;
    }else if(JSON.stringify(cur)===JSON.stringify(r)) rep.same++;
    else if((r.at||'')>(cur.at||'')){S.recs[id]=r;rep.newer++}
    else rep.kept++;
  }
  return rep;
}

let stream=null,scanRun=false,detector=null,zxReader=null;
async function loadZX(){
  if(window.ZXing) return;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
}
async function startScan(opt){
  $('scanTitle').textContent=opt.title;$('scanSub').textContent=opt.sub||'';$('scanMsg').textContent='กำลังเปิดกล้อง...';
  $('scan').classList.remove('hide');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    $('scanMsg').textContent='เปิดกล้องไม่ได้ ('+(e.name||'error')+') — ต้องเปิดผ่านเว็บ https และอนุญาตกล้อง หรือใช้การพิมพ์เลขแทน';return;
  }
  const v=$('vid');v.srcObject=stream;await v.play().catch(()=>{});
  scanRun=true;$('scanMsg').textContent='เล็งบาร์โค้ดให้อยู่กลางภาพ';
  let useNative=false;
  if('BarcodeDetector' in window){try{detector=new BarcodeDetector({formats:['code_128','code_39','ean_13','itf','codabar','qr_code']});useNative=true}catch(e){}}
  if(!useNative){try{await loadZX()}catch(e){$('scanMsg').textContent='โหลดตัวอ่านบาร์โค้ดไม่ได้ (ต้องต่ออินเทอร์เน็ต) ใช้การพิมพ์เลขแทน';return}
    const H=new Map();H.set(ZXing.DecodeHintType.TRY_HARDER,true);
    H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.QR_CODE]);
    zxReader=new ZXing.MultiFormatReader();zxReader.setHints(H);}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  let last='',cnt=0;
  const tick=async()=>{
    if(!scanRun) return;
    let code='';
    try{
      if(v.readyState>=2){
        if(useNative){const r=await detector.detect(v);if(r.length) code=r[0].rawValue}
        else{cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
          const src=new ZXing.HTMLCanvasElementLuminanceSource(cv),bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
          try{code=zxReader.decode(bmp).getText()}catch(e){}}
      }
    }catch(e){}
    if(code){ if(code===last) cnt++; else {last=code;cnt=1}
      if(cnt>=2){stopScan();beep(1100,.1,1);buzz(60);opt.onCode(code);return} }
    setTimeout(tick,useNative?120:200);
  };
  tick();
}
function stopScan(){scanRun=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('scan').classList.add('hide')}

let syncBusy=false,syncState='',lastSync='',syncTimer=null;
function enq(id,del){S.q=S.q.filter(o=>o.id!==id);const m=BYID[id]||{};
  S.q.push(del?{op:'del',id}:{op:'save',id,floor:m.fl||'',zone:m.zn||'',room:m.room||'',rec:S.recs[id]})}
function commit(id,del){enq(id,del);persist();applyFilter();sync()}
const cfgOn=()=>!!(S.cfg.url&&S.cfg.key);
function showSync(){
  let s;
  if(!cfgOn()) s='☁ ยังไม่ได้ตั้งค่าซิงค์ — ผลเก็บในเครื่องนี้เท่านั้น';
  else if(syncState==='key') s='⚠ รหัสทีมหรือ URL ไม่ถูกต้อง';
  else if(syncState==='off') s=`⚠ ส่งไม่ได้ (ออฟไลน์?) รอส่ง ${S.q.length} รายการ จะลองใหม่อัตโนมัติ`;
  else if(S.q.length) s=`☁ กำลังส่ง/รอส่ง ${S.q.length} รายการ`;
  else s='☁ ซิงค์แล้ว '+lastSync;
  $('sync').textContent=s;
}
async function api(body){
  const r=await fetch(S.cfg.url,{method:'POST',body:JSON.stringify(Object.assign({key:S.cfg.key},body))});
  return r.json();
}
async function sync(){
  if(!cfgOn()){showSync();return}
  if(syncBusy)return;syncBusy=true;
  try{
    while(S.q.length){
      const batch=S.q.slice(0,25);
      const j=await api({ops:batch});
      if(!j.ok){syncState=j.err==='key'?'key':'off';showSync();syncBusy=false;return}
      const clashes=[];
      batch.forEach((o,i)=>{const r=(j.results||[])[i]||{};
        if(r.ok===false&&r.dup){clashes.push([o,r.dup])}});
      S.q=S.q.slice(batch.length);
      clashes.forEach(([o,d])=>{delete S.recs[o.id];
        if(BYID[d.id]) dupAlert({d:digits(o.rec.asset),id:d.id,rec:{by:d.by,at:d.at},same:false});});
      persist();
    }
    const r=await fetch(S.cfg.url+'?key='+encodeURIComponent(S.cfg.key));const j=await r.json();
    if(!j.ok){syncState='key';showSync();syncBusy=false;return}
    const pend=new Set(S.q.map(o=>o.id)),nr={};
    Object.entries(j.recs).forEach(([id,v])=>{if(!pend.has(id))nr[id]=v});
    pend.forEach(id=>{if(S.recs[id])nr[id]=S.recs[id]});
    S.recs=nr;persist();syncState='ok';lastSync=now().slice(11);
    if(curId===null)applyFilter();else renderList();
  }catch(e){syncState='off'}
  syncBusy=false;showSync();
}
$('cfgSave').onclick=async()=>{
  S.cfg.url=$('cfgUrl').value.trim();S.cfg.key=$('cfgKey').value.trim();
  if(!cfgOn()){$('cfgRes').textContent='กรอกให้ครบทั้ง URL และรหัสทีม';return}
  $('cfgRes').textContent='กำลังทดสอบ...';
  try{const r=await fetch(S.cfg.url+'?key='+encodeURIComponent(S.cfg.key));const j=await r.json();
    if(!j.ok){$('cfgRes').textContent='❌ รหัสทีมไม่ถูกต้อง';return}
    Object.keys(S.recs).forEach(i=>{if(!S.q.some(o=>o.id===i))enq(i)});
    persist();$('cfgRes').textContent='✓ เชื่อมต่อสำเร็จ กำลังส่งผลที่มีในเครื่องขึ้น Sheets';sync();
  }catch(e){$('cfgRes').textContent='❌ เชื่อมต่อไม่ได้ ตรวจ URL และอินเทอร์เน็ต'}
};
$('syncNow').onclick=()=>{syncState='';sync()};
window.addEventListener('online',()=>sync());
setInterval(()=>sync(),45000);

load();$('who').value=S.who||'';$('cfgUrl').value=S.cfg.url;$('cfgKey').value=S.cfg.key;showSync();sync();initFilters();applyFilter();
</script>
